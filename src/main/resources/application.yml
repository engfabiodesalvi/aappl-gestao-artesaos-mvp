spring:
  application:
    name: aappl-gestao-artesaos-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aappl_mvp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
